name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Compiling Requirements
        run: |
          pip install --upgrade pip
          pip install "flet[cli]" yt-dlp

      - name: Pre-Install Native Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android SDK Manager
        uses: android-actions/setup-android@v3

      - name: Link SDK Paths Natively
        run: |
          flutter config --android-sdk "$ANDROID_HOME"
          flutter config --jdk-dir "$JAVA_HOME"
          yes | sdkmanager --licenses || true

      - name: Compile Production APK Package
        run: |
          # Use flet pack to cleanly compile your scripts and graphics natively
          flet pack main.py --assets assets

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drac-media-App
          path: dist/*.apk
