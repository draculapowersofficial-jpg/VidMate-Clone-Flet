name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Compiling Requirements
        run: |
          pip install --upgrade pip
          pip install "flet[cli]" yt-dlp

      - name: Pre-Install Native Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android SDK Manager
        uses: android-actions/setup-android@v3

      - name: Bootstrap Mobile App Template
        run: |
          # Creates a completely fresh mobile boilerplate workspace inside a workspace folder
          flet create --template app workspace_dir
          
          # Copy your custom main.py and your asset images directly into the active compilation folder
          cp main.py workspace_dir/main.py
          if [ -d "assets" ]; then cp -r assets workspace_dir/; fi

      - name: Pre-Configure Native Tool Channels
        run: |
          flutter config --no-analytics
          flutter config --android-sdk "$ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Compile Native Production APK Package
        run: |
          # Change directory into the working mobile workspace to compile cleanly where pubspec.yaml lives
          cd workspace_dir
          flutter build apk --release

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drac-media-App
          path: workspace_dir/build/app/outputs/flutter-apk/*-release.apk
