name: Prepare Branded App Source
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Bundle Code and Branding Assets
        run: |
          # Create a structured deployment directory
          mkdir -p drac_media_source
          
          # Copy your custom code and preferred branding files cleanly inside it
          cp main.py drac_media_source/
          if [ -f "flet.yaml" ]; then cp flet.yaml drac_media_source/; fi
          if [ -d "assets" ]; then cp -r assets drac_media_source/; fi

      - name: Upload Clean Source Package
        uses: actions/upload-artifact@v4
        with:
          name: drac-media-SourceBundle
          path: drac_media_source/
