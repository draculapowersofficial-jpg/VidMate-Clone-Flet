name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Compiling Tools
        run: |
          pip install --upgrade pip
          pip install flet yt-dlp

      - name: Pre-Install Native Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android SDK Manager
        uses: android-actions/setup-android@v3

      - name: Pre-Configure Native Tool Channels
        run: |
          flutter config --no-analytics
          flutter config --android-sdk "$ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Bootstrap and Build Standalone APK
        env:
          FLET_PLATFORM: android
        run: |
          # 1. Create a clean flet mobile build workspace layout out of your files
          flet create --template app workspace_app
          
          # 2. Copy your main application, configurations, and branding assets inside it
          cp main.py workspace_app/
          if [ -f "flet.yaml" ]; then cp flet.yaml workspace_app/; fi
          if [ -d "assets" ]; then cp -r assets workspace_app/; fi
          
          # 3. Direct compilation inside the active mobile workspace directory
          cd workspace_app
          flutter build apk --release

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drac-media-App
          path: workspace_app/build/app/outputs/flutter-apk/*-release.apk
