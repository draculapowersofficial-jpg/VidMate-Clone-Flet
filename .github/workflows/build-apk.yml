name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Compiling Tools
        run: |
          pip install --upgrade pip
          pip install flet yt-dlp

      - name: Pre-Install Native Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android SDK Manager
        uses: android-actions/setup-android@v3

      - name: Pre-Configure Native Tool Channels
        run: |
          flutter config --no-analytics
          flutter config --android-sdk "$ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Bootstrap and Build Standalone APK
        env:
          FLET_PLATFORM: android
        run: |
          # 1. Instruct Flet to cleanly unpack the Flutter project layout template natively
          flet build apk --unpacked
          
          # 2. Change directory into the newly extracted workspace folder where pubspec.yaml lives
          cd build/apk
          
          # 3. Direct compilation using Flutter's native, bulletproof compilation system
          flutter build apk --release

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drac-media-App
          path: build/apk/build/app/outputs/flutter-apk/*-release.apk
