name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Compiling Tools
        run: |
          pip install --upgrade pip
          pip install flet yt-dlp

      - name: Pre-Install Native Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android SDK Manager
        uses: android-actions/setup-android@v3

      - name: Pre-Configure Native Tool Channels
        run: |
          flutter config --no-analytics
          flutter config --android-sdk "$ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Bootstrap and Build Standalone APK
        env:
          FLET_PLATFORM: android
        run: |
          # 1. This special build command forces Flet to generate the real pubspec.yaml and mobile folders
          flet build template apk --name drac-media --package com.draculap.dracmedia
          
          # 2. Merge your personal assets and custom code into the active source code directories
          if [ -d "assets" ]; then cp -r assets/* build/app/assets/ || true; fi
          cp main.py build/app/main.py || cp main.py build/app/lib/main.py || true
          
          # 3. Direct compilation inside the generated mobile workspace directory
          cd build/app
          flutter build apk --release

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drac-media-App
          path: build/app/build/app/outputs/flutter-apk/*-release.apk
