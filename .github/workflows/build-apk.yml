name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Compiling Requirements
        run: |
          pip install --upgrade pip
          pip install "flet[cli]" yt-dlp

      - name: Pre-Install Native Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android SDK Manager
        uses: android-actions/setup-android@v3

      - name: Bootstrap Mobile App Template
        run: |
          # This extracts the correct mobile directory structures and creates pubspec.yaml automatically
          flet build template apk --name drac-media --package com.draculap.dracmedia

      - name: Pre-Configure Native Tool Channels
        run: |
          flutter config --no-analytics
          flutter config --android-sdk "$ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Compile Native Production APK Package
        run: |
          # Moves into the generated template directory to run the compiler safely
          flutter build apk --release

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drac-media-App
          path: build/app/outputs/flutter-apk/*-release.apk
