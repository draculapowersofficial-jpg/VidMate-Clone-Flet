name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Compiling Tools
        run: |
          pip install --upgrade pip
          pip install flet yt-dlp

      - name: Pre-Install Native Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android SDK Manager
        uses: android-actions/setup-android@v3

      - name: Pre-Configure Native Tool Channels
        run: |
          flutter config --no-analytics
          flutter config --android-sdk "$ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Bootstrap and Build Standalone APK
        run: |
          # 1. Create a native Flutter mobile application skeleton folder cleanly
          flutter create --org com.draculap --project-name drac_media workspace_app
          
          # 2. Open up its package settings file and inject Flet configurations
          cd workspace_app
          echo "  flet:" >> pubspec.yaml
          
          # 3. Create the python assets repository paths inside the mobile structure
          mkdir -p assets/app
          cp ../main.py assets/app/main.py
          if [ -d "../assets" ]; then cp -r ../assets/* assets/app/ || true; fi
          
          # 4. Direct native compilation that skips the broken flet-cli wrapper entirely
          flutter build apk --release

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drac-media-App
          path: workspace_app/build/app/outputs/flutter-apk/*-release.apk
